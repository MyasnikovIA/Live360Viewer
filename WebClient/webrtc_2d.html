<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Live360 WebRTC</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        video { width: 800px; max-width: 90%; border: 2px solid #333; border-radius: 8px; background: black; }
        .status { margin-top: 15px; color: #4CAF50; font-size: 18px; font-weight: bold; }
        #playBtn { display: none; margin-top: 20px; padding: 15px 30px; font-size: 20px; cursor: pointer; background: #6200EE; color: white; border: none; border-radius: 8px; }
        #playBtn:hover { background: #3700B3; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <div class="status" id="status">Подключение...</div>
    <button id="playBtn">🔊 Нажмите для запуска видео со звуком</button>

    <script>
        const SIGNALING_URL = "ws://192.168.131.4:9090";

        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        let pc = null;
        let remoteStream = null;
        let playAttemptInFlight = false;

        function tryPlay() {
            if (!video.paused && video.readyState >= 2) return;
            if (playAttemptInFlight) return;
            playAttemptInFlight = true;

            video.play()
                .then(() => console.log("video.play() OK"))
                .catch(e => {
                    console.log("video.play() rejected:", e.name, e.message);
                    playBtn.style.display = "block";
                    playBtn.innerText = "🔊 Включить видео и звук";
                })
                .finally(() => { playAttemptInFlight = false; });
        }

        function connect() {
            const ws = new WebSocket(SIGNALING_URL);

            ws.onopen = () => {
                statusText.innerText = "Ожидание SDP Offer...";
                statusText.style.color = "#aaa";
            };

            ws.onmessage = async (msg) => {
                const data = JSON.parse(msg.data);

                if (data.type === 'offer') {
                    statusText.innerText = "Получен Offer, создаем Answer...";

                    if (!pc) {
                        pc = new RTCPeerConnection({
                            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
                        });

                        pc.ontrack = (event) => {
                            console.log("Получен трек:", event.track.kind, "streams:", event.streams.length);
                            if (!remoteStream) {
                                remoteStream = event.streams[0];
                                video.srcObject = remoteStream;
                                console.log("srcObject set, stream id =", remoteStream.id);
                            }
                        };

                        pc.oniceconnectionstatechange = () => {
                            console.log("ICE State:", pc.iceConnectionState);
                            if (pc.iceConnectionState === 'connected' ||
                                pc.iceConnectionState === 'completed') {
                                statusText.innerText = "Соединение установлено!";
                                statusText.style.color = "#4CAF50";
                                tryPlay();
                            } else if (pc.iceConnectionState === 'failed') {
                                statusText.innerText = "Ошибка соединения ICE.";
                                statusText.style.color = "red";
                            }
                        };

                        pc.onicecandidate = (event) => {
                            if (event.candidate) {
                                ws.send(JSON.stringify({
                                    type: 'candidate',
                                    candidate: event.candidate
                                }));
                            }
                        };
                    }

                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);

                    ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
                } else if (data.type === 'candidate') {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            };

            ws.onerror = () => {
                statusText.innerText = "Ошибка WebSocket. Проверьте IP и порт.";
                statusText.style.color = "red";
            };
        }

        playBtn.addEventListener('click', () => {
            video.muted = false;
            video.volume = 1.0;
            video.play().then(() => {
                playBtn.style.display = "none";
                statusText.innerText = "Видео + звук воспроизводятся";
                statusText.style.color = "#4CAF50";
            }).catch(e => {
                console.error("play error after click:", e);
            });
        });

        video.addEventListener('loadedmetadata', () => {
            console.log("video metadata loaded:", video.videoWidth + "x" + video.videoHeight);
            if (video.paused) tryPlay();
        });

        video.addEventListener('playing', () => {
            statusText.innerText = "Видео воспроизводится";
            statusText.style.color = "#4CAF50";
        });

        connect();
    </script>
</body>
</html>
